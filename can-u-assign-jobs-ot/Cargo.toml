[package]
name = "can-u-assign-jobs-ot"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "can-u-assign-jobs-ot"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.15"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
thiserror = "1"
chrono = "0.4"
jsonwebtoken = "8.0.0-beta.8"
hex = "0.4"
ring = "0.17"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
