[package]
name = "can-u-assign-jobs-ot"
version.workspace = true
edition.workspace = true
authors = ["Pike <pike@harbourlabs.dev>", "Has <has@harbourlabs.dev>"]

[[bin]]
name = "can-u-assign-jobs-ot"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.15"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros"] }
thiserror = "1"
chrono = "0.4"
ring = "0.16"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
]
